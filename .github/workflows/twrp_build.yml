name: TWRP for gta4lve

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Create temp dir and initialize repo
      run: |
        mkdir ~/twrp && cd ~/twrp
        sudo apt update
        sudo apt install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev libc6-dev \
         libncurses5-dev x11proto-core-dev libx11-dev libgl1-mesa-dev libxml2-utils xsltproc unzip \
         fontconfig repo liblz4-tool bc lzop pngcrush schedtool squashfs-tools dpkg-dev \
         libssl-dev imagemagick libwxgtk3.0-gtk3-dev python3 lib32ncurses6 lib32z1 \
         liblz4-tool libncurses5 curl gcc clang libtinfo5 libncurses5-dev \
         libstdc++6 python-is-python3 python3-pip

        cd ~/twrp
        git config --global user.email "you@example.com"
        git config --global user.name "Your Name"
        repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1 --depth=1
        repo sync -j$(nproc --all)

    - name: Clone device tree
      run: |
        cd ~/twrp
        git clone https://github.com/faksgis/twrp_device_samsung_gta4lve.git -b android-12.1 device/samsung/gta4lve

    - name: Setup environment
      run: |
        cd ~/twrp
        export ALLOW_MISSING_DEPENDENCIES=true
        . build/envsetup.sh
        lunch twrp_gta4lve-eng

    - name: Clean up runner to free space
      run: |
        echo "Before cleanup:"
        df -h
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo apt-get clean
        echo "After cleanup:"
        df -h

    - name: Build TWRP
      run: |
        cd ~/twrp
        make clean
        make -j$(nproc --all) recoveryimage

    - name: Compress recovery.img
      run: |
        cd ~/twrp/out/target/product/gta4lve
        xz -z -9 recovery.img

    - name: Upload recovery artifact
      uses: actions/upload-artifact@v4
      with:
        name: twrp_recovery_gta4lve
        path: ~/twrp/out/target/product/gta4lve/recovery.img.xz
