name: Build TWRP for gta4lve

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up required packages
        run: |
          sudo apt update
          sudo apt install -y git curl repo python3-kerberos

      - name: Create working directory
        run: |
          mkdir -p ~/twrp && cd ~/twrp

      - name: Initialize and sync TWRP repo
        run: |
          cd ~/twrp
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp -b twrp-12.1
          repo sync -c --no-tags --no-clone-bundle --depth=1 -j8

      - name: Clone device tree
        run: |
          cd ~/twrp
          git clone https://github.com/faksgis/twrp_device_samsung_gta4lve.git device/samsung/gta4lve

      - name: Build TWRP
        run: |
          cd ~/twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          . build/envsetup.sh
          lunch twrp_gta4lve-eng
          mka recoveryimage

      - name: Upload recovery.img
        uses: actions/upload-artifact@v4
        with:
          name: recovery.img
          path: ~/twrp/out/target/product/gta4lve/recovery.img
