name: Build TWRP for gta4lve

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Git config
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Install required packages
        run: |
          sudo apt update
          sudo apt install -y bc build-essential ccache curl git libncurses5-dev \
            libssl-dev libxml2 libxml2-utils lzop pngcrush schedtool squashfs-tools \
            xsltproc zip zlib1g-dev openjdk-11-jdk android-sdk-libsparse-utils

      - name: Set up environment
        run: |
          sudo apt install repo -y || true
          mkdir -p ~/twrp && cd ~/twrp
          echo 'Initializing repo...'
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp -b twrp-12.1
          repo sync -j$(nproc) --force-sync

      - name: Clone device tree
        run: |
          cd ~/twrp
          git clone https://github.com/faksgis/twrp_device_samsung_gta4lve.git device/samsung/gta4lve

      - name: Build TWRP
        run: |
          cd ~/twrp
          source build/envsetup.sh
          lunch twrp_gta4lve-eng
          make -j$(nproc) recoveryimage

      - name: Upload recovery.img
        uses: actions/upload-artifact@v4
        with:
          name: twrp-gta4lve
          path: out/target/product/gta4lve/recovery.img
