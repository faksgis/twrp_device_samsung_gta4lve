name: Build TWRP for gta4lve

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git wget curl python2 bc bison build-essential zip \
          unzip libssl-dev ca-certificates openjdk-8-jdk repo rsync \
          libncurses5-dev libncurses-dev lzop libxml2-utils

        # link python2 as default
        sudo ln -sf /usr/bin/python2 /usr/bin/python

    - name: Initialize repo
      run: |
        mkdir -p ~/twrp && cd ~/twrp
        repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1
        repo sync -j$(nproc) --force-sync

    - name: Clone device tree
      run: |
        cd ~/twrp
        git clone https://github.com/faksgis/twrp_device_samsung_gta4lve.git device/samsung/gta4lve

    - name: Build TWRP
      run: |
        cd ~/twrp
        source build/envsetup.sh
        lunch twrp_gta4lve-eng
        mka recoveryimage

    - name: Upload recovery image
      uses: actions/upload-artifact@v4
      with:
        name: recovery.img
        path: ~/twrp/out/target/product/gta4lve/recovery.img
