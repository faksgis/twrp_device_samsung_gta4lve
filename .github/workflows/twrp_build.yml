name: Build TWRP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: إعداد بيئة العمل
      uses: actions/checkout@v3

    - name: تثبيت الحزم المطلوبة
      run: |
        sudo apt-get update
        sudo apt-get install git-core gnupg flex bison build-essential zip curl zlib1g-dev \
        gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev \
        libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig bc \
        python-is-python3 rsync -y

    - name: تنزيل مصدر TWRP
      run: |
        mkdir -p ~/twrp
        cd ~/twrp
        repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1
        repo sync -j4

    - name: نسخ ملفات الجهاز
      run: |
        cd ~/twrp/device
        mkdir -p samsung
        cp -r $GITHUB_WORKSPACE samsung/gta4lve

    - name: بدء البناء
      run: |
        cd ~/twrp
        . build/envsetup.sh
        lunch twrp_gta4lve-eng
        make -j$(nproc) recoveryimage

    - name: رفع النتيجة
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-Recovery
        path: ~/twrp/out/target/product/gta4lve/recovery.img
